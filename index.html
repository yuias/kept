<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171c24" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-title" content="kept" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Access guards every path. A manifest request without credentials is
         redirected to the Access login page and the manifest silently fails. -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <title>kept</title>
  </head>
  <body>
    <script>
      // Runs before the first paint so a manual theme choice never flashes the
      // other scheme. Kept in step with src/client/lib/theme.svelte.ts.
      try {
        var theme = localStorage.getItem('kept.theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch {}
    </script>
    <div id="app"></div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
